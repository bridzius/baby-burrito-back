[package]
name = "baby-burrito"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
getrandom = "0.4"
hex = "0.4.3"
jsonwebtoken = { version = "11", features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
